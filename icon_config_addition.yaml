dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Add flutter_launcher_icons for automatic icon generation
  flutter_launcher_icons: ^0.13.1

# Icon configuration
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/famka_icon_1024.png"
  min_sdk_android: 21
  
  # Web configuration
  web:
    generate: true
    image_path: "assets/icons/famka_icon_1024.png"
    background_color: "#4A90E2"
    theme_color: "#4A90E2"
  
  # Adaptive icons for Android 8+
  adaptive_icon_background: "#4A90E2"
  adaptive_icon_foreground: "assets/icons/famka_icon_foreground.png"

# Run after adding icons: flutter packages pub run flutter_launcher_icons:main